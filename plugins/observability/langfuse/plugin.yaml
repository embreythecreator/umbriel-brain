name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Umbriel — traces conversations, LLM calls, and tool usage. Opt-in via `umbriel plugins enable observability/langfuse` or `umbriel tools → Langfuse Observability`."
author: embreythecreator
requires_env:
  - UMBRIEL_LANGFUSE_PUBLIC_KEY
  - UMBRIEL_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_finalize
  - on_session_end
  - subagent_start
  - subagent_stop
